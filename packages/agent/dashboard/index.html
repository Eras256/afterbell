<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Afterbell — agent dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0e14;
    --panel: #131722;
    --border: #232838;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --green: #3ecf8e;
    --red: #f0616d;
    --amber: #e8b04b;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 20px; margin-top: 4px; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge.after-hours { background: rgba(62,207,142,0.15); color: var(--green); }
  .badge.regular { background: rgba(110,168,254,0.15); color: var(--accent); }
  .badge.pre-market { background: rgba(232,176,75,0.15); color: var(--amber); }
  .badge.closed { background: rgba(139,147,167,0.15); color: var(--muted); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  .action-buy { color: var(--green); font-weight: 600; }
  .action-sell { color: var(--red); font-weight: 600; }
  .action-hold { color: var(--muted); }
  section { margin-bottom: 28px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 10px; }
  .empty { color: var(--muted); padding: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  code { color: var(--accent); }
</style>
</head>
<body>
  <h1>Afterbell — agent dashboard</h1>
  <div class="sub">Generated by <code>03-agent-loop.ts</code>. Read-only: this view never signs or sends anything.</div>

  <div class="grid" id="summary"></div>

  <section>
    <h2>Portfolio</h2>
    <div id="portfolio"></div>
  </section>

  <section>
    <h2>Rebalance plan (not executed)</h2>
    <div id="plan"></div>
  </section>

  <script src="state.js"></script>
  <script>
    const state = window.AFTERBELL_STATE ?? { session: 'unknown', gateOpen: false, snapshot: null, plan: null };
    const fmtUsd = (n) => n == null ? '—' : n.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 });
    const fmtPct = (n) => n == null ? '—' : (n * 100).toFixed(1) + '%';
    const fmtNum = (n) => n == null ? '—' : n.toLocaleString('en-US', { maximumFractionDigits: 4 });

    function renderSummary() {
      const el = document.getElementById('summary');
      const owner = state.snapshot?.owner ?? '—';
      const sol = state.snapshot?.solBalance;
      const total = state.snapshot?.totalValueUsd;
      el.innerHTML = `
        <div class="card">
          <div class="label">Market session</div>
          <div class="value"><span class="badge ${state.session}">${state.session}</span></div>
        </div>
        <div class="card">
          <div class="label">Agent gate</div>
          <div class="value">${state.gateOpen ? 'active' : 'idle'}</div>
        </div>
        <div class="card">
          <div class="label">Team wallet</div>
          <div class="value" style="font-size:12px; word-break:break-all;">${owner}</div>
        </div>
        <div class="card">
          <div class="label">SOL balance</div>
          <div class="value">${sol == null ? '—' : sol + ' SOL'}</div>
        </div>
        <div class="card">
          <div class="label">Portfolio value</div>
          <div class="value">${fmtUsd(total)}</div>
        </div>
      `;
    }

    function renderPortfolio() {
      const el = document.getElementById('portfolio');
      const holdings = state.snapshot?.holdings ?? [];
      if (!holdings.length) {
        el.innerHTML = `<div class="empty">No snapshot yet -- agent is idle outside the after-hours window, or hasn't run. Run <code>npx tsx src/scripts/03-agent-loop.ts --force</code> to populate one.</div>`;
        return;
      }
      const total = state.snapshot.totalValueUsd ?? 0;
      const rows = holdings.map((h) => `
        <tr>
          <td>${h.symbol}</td>
          <td>${fmtNum(h.amountUi)}</td>
          <td>${fmtUsd(h.priceUsd)}</td>
          <td>${fmtUsd(h.valueUsd)}</td>
          <td>${fmtPct(total > 0 ? (h.valueUsd ?? 0) / total : 0)}</td>
        </tr>
      `).join('');
      el.innerHTML = `
        <table>
          <thead><tr><th>Symbol</th><th>Amount</th><th>Price</th><th>Value</th><th>Weight</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function renderPlan() {
      const el = document.getElementById('plan');
      const actions = state.plan?.actions ?? [];
      if (!actions.length) {
        el.innerHTML = `<div class="empty">${state.plan?.note ?? 'No rebalance plan for this run.'}</div>`;
        return;
      }
      const rows = actions.map((a) => `
        <tr>
          <td>${a.symbol}</td>
          <td class="action-${a.action}">${a.action}</td>
          <td>${fmtPct(a.currentWeight)}</td>
          <td>${fmtPct(a.targetWeight)}</td>
          <td>${fmtUsd(a.deltaUsd)}</td>
        </tr>
      `).join('');
      el.innerHTML = `
        <table>
          <thead><tr><th>Symbol</th><th>Action</th><th>Current</th><th>Target</th><th>Δ USD</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    renderSummary();
    renderPortfolio();
    renderPlan();
  </script>
</body>
</html>
